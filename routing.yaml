rules:
  # 本地域名和已知私有 IP 直连。
  - RULE-SET,private,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve

  # 广告优先拦截。
  - RULE-SET,category-ads-all,REJECT

  # TikTok 可独立选节点，国内抖音直连；应用名单先于国内和海外通用名单。
  - RULE-SET,tiktok,TikTok
  - RULE-SET,douyin,DIRECT

  # 海外 AI 先于 Apple、Google 和微软大类。
  - RULE-SET,apple-intelligence,AI 服务
  - RULE-SET,google-gemini,AI 服务
  - RULE-SET,category-ai-non-cn,AI 服务

  # 已知跨境券商、支付和加密资产先于金融大类。
  - RULE-SET,ibkr,证券券商
  - RULE-SET,schwab,证券券商
  - RULE-SET,futu,证券券商
  - RULE-SET,wise,跨境支付
  - RULE-SET,paypal,跨境支付
  - RULE-SET,stripe,跨境支付
  - RULE-SET,visa,跨境支付
  - RULE-SET,mastercard,跨境支付
  - RULE-SET,category-cryptocurrency,加密资产

  # 境内银行和券商直连。汇丰中国先于汇丰集团。
  - RULE-SET,hsbc-cn,DIRECT
  - RULE-SET,category-bank-cn,DIRECT
  - RULE-SET,category-securities-cn,DIRECT

  # 单独分组上游收录的汇丰和日本银行域名。
  - RULE-SET,hsbc,银行服务
  - RULE-SET,category-bank-jp,银行服务

  # Telegram 支持按域名或已知 IP 匹配；平台专属规则先于母公司。
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram-ip,Telegram,no-resolve
  - RULE-SET,youtube,流媒体
  - RULE-SET,netflix,流媒体
  - RULE-SET,disney,流媒体
  - RULE-SET,hbo,流媒体
  - RULE-SET,primevideo,流媒体
  - RULE-SET,spotify,流媒体
  - RULE-SET,apple-tvplus,流媒体
  - RULE-SET,github,开发平台
  - RULE-SET,gitlab,开发平台
  - RULE-SET,docker,开发平台

  # 境内平台域名和国内通用域名先于平台大类直连。
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,icloud-tag-cn,DIRECT
  - RULE-SET,microsoft-tag-cn,DIRECT
  - RULE-SET,google-tag-cn,DIRECT
  - RULE-SET,cn-domain,DIRECT

  # 优先区分其余金融和海外游戏，再匹配平台大类及通用海外域名。
  - RULE-SET,category-finance,其他金融
  - RULE-SET,category-games-non-cn,游戏平台
  - RULE-SET,icloud,Apple 与 iCloud
  - RULE-SET,apple,Apple 与 iCloud
  - RULE-SET,google,Google 服务
  - RULE-SET,microsoft,微软服务
  - RULE-SET,geolocation-non-cn,海外应用

  # 其余流量再检查中国大陆 IP；未携带目标 IP 时允许解析域名。
  - RULE-SET,cn-ip,DIRECT

  - MATCH,未分类流量

# 3X-UI Clash / Mihomo 远程路由模板（v3.7.0+）
# 把本文件的公开 Raw HTTPS 地址填入面板订阅设置中的「全局路由规则」。
# 各场景默认跟随 PROXY。PROXY 首选自动测速，也可在任一场景手动固定节点或选择 DIRECT。
# 自动测速每 60 秒比较所有订阅节点的响应延迟。组图标随订阅内嵌。
# 客户端按 rules 顺序取首条匹配。所有域名和 IP 名单均取自 MetaCubeX，客户端每小时检查一次更新。

proxy-groups:
  - name: 自动测速
    type: url-test
    icon: "data:image/svg+xml;base64,"
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 60
    timeout: 5000
    tolerance: 0
    lazy: false
  - name: PROXY
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [自动测速, DIRECT]
    include-all-proxies: true
  - name: 海外应用
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: AI 服务
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 流媒体
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: TikTok
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: Apple 与 iCloud
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 银行服务
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 证券券商
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 跨境支付
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 加密资产
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 其他金融
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: Telegram
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 开发平台
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: Google 服务
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 微软服务
    type: select
    icon: "data:image/svg+xml;base64,"
    proxies: [PROXY, 自动测速, DIRECT]
    include-all-proxies: true
  - name: 游戏平台
    type: select
    icon: "data:image/svg+xml;base64,"
